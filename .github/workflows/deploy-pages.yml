# Builds the site and publishes it to GitHub Pages.
#
# GitHub Pages serves this repository from the `gh-pages` branch, which holds
# only generated output — never edit it by hand. This workflow rebuilds that
# branch from source on every push to the default branch. Pushes to other
# branches run the build and the checks as CI and publish nothing.
#
# Publishing by pushing a branch means the built-in GITHUB_TOKEN is enough:
# `contents: write` is a permission a workflow can grant itself, whereas
# creating a Pages deployment through the API needs Pages to have been enabled
# by an account with admin rights first.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Let a running publish finish rather than cancelling it half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Where the site will be served from, worked out from the repository
      # itself:
      #   user/org site, or a CNAME file -> a domain root, no path prefix
      #   project site                   -> served under /<repo>/
      - name: Resolve deployment target
        id: target
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          owner_lc="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          if [ -f CNAME ]; then
            domain="$(tr -d '[:space:]' < CNAME)"
            origin="https://$domain"; base=""
          elif [ "$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner_lc.github.io" ]; then
            origin="https://$owner_lc.github.io"; base=""
          else
            origin="https://$owner_lc.github.io"; base="/$repo"
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Publishing to ${origin}${base}/"

      - name: Build
        env:
          GE_ORIGIN: ${{ steps.target.outputs.origin }}
          GE_BASE: ${{ steps.target.outputs.base }}
        run: python3 scripts/build.py

      - name: Check structure, links, assets and accessibility
        env:
          GE_BASE: ${{ steps.target.outputs.base }}
        run: python3 scripts/check.py

      - name: Package
        run: python3 scripts/package.py

      # Replaces the published tree wholesale and commits on top of whatever is
      # already on gh-pages — no force-push, so nothing can be clobbered, and
      # an unchanged build makes no empty commit.
      - name: Publish to gh-pages
        if: github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch gh-pages "$remote" out 2>/dev/null || {
            git clone --depth 1 "$remote" out
            git -C out checkout --orphan gh-pages
            git -C out rm -rq --cached . || true
            find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          }

          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. out/

          cd out
          git add -A
          if git diff --staged --quiet; then
            echo "Site is unchanged — nothing to publish."
            exit 0
          fi
          git commit -q -m "Publish ${GITHUB_SHA:0:7} to GitHub Pages"
          git push origin gh-pages
          echo "Published ${{ steps.target.outputs.origin }}${{ steps.target.outputs.base }}/"
